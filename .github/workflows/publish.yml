name: Publish

on:
  push:
    tags:
      - "publish-marketplace-v*"
      - "publish-ovsx-v*"

permissions:
  contents: read

jobs:
  marketplace:
    if: startsWith(github.ref_name, 'publish-marketplace-v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx @vscode/vsce@4.1.0 publish --oidc --githubBranch release/maotou316

  open-vsx:
    if: startsWith(github.ref_name, 'publish-ovsx-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx @vscode/vsce@4.1.0 package --githubBranch release/maotou316 -o extension.vsix
      - run: |
          if [ "$(curl -s -o /dev/null -w '%{http_code}' https://open-vsx.org/api/maotou316)" = "404" ]; then
            npx ovsx@1.3.0 create-namespace maotou316 -p "$OVSX_PAT"
          fi
          npx ovsx@1.3.0 publish extension.vsix -p "$OVSX_PAT"
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
