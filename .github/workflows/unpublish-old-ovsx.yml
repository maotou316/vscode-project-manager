name: Unpublish old Open VSX ID

on:
  push:
    tags:
      - "unpublish-old-ovsx"

permissions:
  contents: read

jobs:
  unpublish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx ovsx@1.3.0 unpublish maotou316.project-manager --force -p "$OVSX_PAT"
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
